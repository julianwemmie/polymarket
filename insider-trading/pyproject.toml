[project]
name = "polymarket-insider-trading"
version = "0.1.0"
description = "Insider trading detection pipeline for Polymarket"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0.0",
    "aiohttp>=3.9",
    "requests>=2.31.0",
    "gql[requests]>=3.4.0",
    "flatten-json>=0.1.13",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
modal = ["modal"]
dashboard = [
    "streamlit>=1.40",
    "duckdb>=1.1",
    "plotly>=5.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.uv]
dev-dependencies = []
