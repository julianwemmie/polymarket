[project]
name = "polymarket-historical-data"
version = "0.1.0"
description = "Historical data pipeline for Polymarket trades via Goldsky subgraph"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "polars>=0.19.0",
    "requests>=2.31.0",
    "gql[requests]>=3.4.0",
    "flatten-json>=0.1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poly_utils", "update_utils"]
